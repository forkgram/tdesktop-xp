name: XP Release.

# Release build of the Windows XP port.
#
# Two jobs with very different requirements:
#
#   patches  runs anywhere. It proves the repository is self-consistent: every
#            patches/*.patch still applies to the submodule commit the tree pins.
#            That is the failure this port actually suffers - a regenerated patch
#            silently losing a hunk, or an upstream bump moving the code a patch
#            targets - and it needs no toolchain, so it gates every push.
#
#   build    needs the XP toolchain, which GitHub-hosted runners cannot provide:
#            the v141_xp 14.16 target, a PATCHED SDK 7.1A include tree, the
#            fpcompat helper objects and the XP-pinned prebuilt dependencies
#            (Qt 5.15.16 static, OpenSSL 1.0.2, FFmpeg 3.4, OpenAL, opus). None of
#            that is installable from a hosted image, so this job targets a
#            self-hosted runner that already carries them. See xp/README.md.

on:
  workflow_dispatch:
    inputs:
      runner_labels:
        description: 'JSON array of runner labels carrying the XP toolchain.'
        type: string
        default: '["self-hosted","windows","xp-toolchain"]'
      rebuild_ffmpeg:
        description: 'Rebuild the XP FFmpeg libraries first (~10 minutes).'
        type: boolean
        default: false
      publish_release:
        description: 'Publish a GitHub Release with the portable archive.'
        type: boolean
        default: false
  push:
    tags:
      - 'xp-v*'
  pull_request:
    paths:
      - 'patches/**'
      - 'xp/**'
      - '.gitmodules'
      - '.github/workflows/xp_release.yml'

permissions:
  contents: write

concurrency:
  group: xp-release-${{ github.ref }}
  cancel-in-progress: false

jobs:

  patches:
    name: Patch set.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # git hands .patch files out with CRLF on a client that translates line
      # endings, and then git apply rejects its own context lines while the base
      # blobs match perfectly. patches/.gitattributes marks them -text; this
      # verifies the result rather than trusting it.
      - name: Line endings.
        run: |
          bad=0
          for patch in patches/*.patch; do
            if grep -qU $'\r' "$patch"; then
              echo "::error file=$patch::contains CR - patches/.gitattributes should keep it -text"
              bad=1
            fi
          done
          if [ "$bad" = "0" ]; then echo "all patches are LF-only."; fi
          exit $bad

      # The authoritative list lives in apply_xp_patches.cmake, so read it from
      # there instead of repeating it here - a patch added without a CI update
      # would otherwise go unchecked.
      - name: Every patch applies to its pinned submodule.
        run: |
          set -e
          list=$(sed -n '/set(xp_patch_list/,/^)/p' patches/apply_xp_patches.cmake \
            | grep -oE '"[^"]+"' | tr -d '"' | paste - -)
          [ -n "$list" ] || { echo "::error::could not read xp_patch_list"; exit 1; }

          failed=0
          while IFS=$'\t' read -r dir file; do
            [ -n "$dir" ] || continue
            if [ ! -e "$dir/.git" ]; then
              echo "::error::submodule $dir is not checked out"
              failed=1
              continue
            fi
            # A pristine checkout must take the patch cleanly. --check does not
            # touch the tree, so the order of the loop does not matter.
            if git -C "$dir" apply --check --binary "$GITHUB_WORKSPACE/patches/$file"; then
              echo "ok    $file -> $dir"
            else
              echo "::error file=patches/$file::does not apply to $dir at its pinned commit"
              failed=1
            fi
          done <<< "$list"
          exit $failed

      - name: The build recipe is present.
        run: |
          set -e
          for required in \
            xp/build_ffmpeg_xp.sh \
            xp/cmake_xp.ps1 \
            xp/xpsafe.ps1 \
            xp/README.md; do
            [ -f "$required" ] || { echo "::error::$required is missing"; exit 1; }
          done
          echo "recipe complete."

  build:
    name: XP x86 Release.
    needs: patches
    runs-on: ${{ fromJSON(github.event.inputs.runner_labels || '["self-hosted","windows","xp-toolchain"]') }}
    timeout-minutes: 240
    if: github.event_name != 'pull_request'

    env:
      # Where the runner keeps the toolchain and the XP-pinned dependencies.
      # Override these at the runner level if its layout differs; xp/cmake_xp.ps1
      # and xp/build_ffmpeg_xp.sh read the same names.
      XP_VCVARS_BAT: ${{ vars.XP_VCVARS_BAT || 'C:\TBuild\xp-port\forkgram-xp\_build_xp.bat' }}
      XP_SDK71A_INCLUDE: ${{ vars.XP_SDK71A_INCLUDE || 'C:\TBuild\xp-port\sdk71a-Include' }}
      XP_QT_PREFIX: ${{ vars.XP_QT_PREFIX || 'C:\TBuild\xp-port\qt-xp-static-prefix' }}
      XP_LIBS_DIR_WIN: ${{ vars.XP_LIBS_DIR_WIN || 'C:\TBuild\xp-port\Libraries-walk' }}
      XP_FFMPEG_WRAPPER: ${{ vars.XP_FFMPEG_WRAPPER || 'C:\TBuild\xp-port\build_ffmpeg_xp.bat' }}
      BUILD_DIR: out/ci-xp

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Clone.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Fail with a readable message instead of a compiler error 2000 lines deep.
      - name: Toolchain present.
        run: |
          $missing = @()
          foreach ($pair in @(
            @{ name = 'XP_VCVARS_BAT'; path = $env:XP_VCVARS_BAT },
            @{ name = 'XP_SDK71A_INCLUDE'; path = $env:XP_SDK71A_INCLUDE },
            @{ name = 'XP_QT_PREFIX'; path = $env:XP_QT_PREFIX },
            @{ name = 'XP_LIBS_DIR_WIN'; path = $env:XP_LIBS_DIR_WIN })) {
            if (-not (Test-Path $pair.path)) { $missing += "$($pair.name) -> $($pair.path)" }
          }
          # The dependencies are pinned to versions the v141_xp toolchain can
          # build; they are NOT what Telegram/build/prepare/prepare.py produces.
          foreach ($lib in @('ffmpeg\libavcodec\libavcodec.a', 'opus\out\Release\opus.lib')) {
            $full = Join-Path $env:XP_LIBS_DIR_WIN $lib
            if (-not (Test-Path $full)) { $missing += "library -> $full" }
          }
          if ($missing.Count -gt 0) {
            Write-Output "This runner does not carry the XP toolchain:"
            $missing | ForEach-Object { Write-Output "  missing $_" }
            Write-Output "See xp/README.md - a GitHub-hosted image cannot supply these."
            exit 1
          }
          Write-Output "XP toolchain and libraries found."

      - name: Read version.
        shell: bash
        run: |
          awk 'NF { print $1"="$2 }' Telegram/build/version >> $GITHUB_ENV
          source <(awk 'NF { print $1"="$2 }' Telegram/build/version)
          echo "Building XP release $AppVersionStr ($AppVersion)."

      - name: FFmpeg libraries.
        if: inputs.rebuild_ffmpeg
        run: |
          & $env:XP_FFMPEG_WRAPPER
          # The wrapper echoes the exit code of the recipe; a stale library set is
          # worse than no build, so stop here when it failed.
          if ($LASTEXITCODE -ne 0) { Write-Error 'FFmpeg build failed'; exit 1 }

      - name: Configure.
        env:
          API_ID: ${{ secrets.TDESKTOP_API_ID }}
          API_HASH: ${{ secrets.TDESKTOP_API_HASH }}
        run: |
          # Fall back to the credentials Telegram publishes for open-source
          # builds (docs/api_credentials.md) so a fork without secrets still
          # builds; they are rate limited, which is fine for a test release.
          $id = if ($env:API_ID) { $env:API_ID } else { '17349' }
          $hash = if ($env:API_HASH) { $env:API_HASH } else { '344583e45741c457fe1862106095a5eb' }
          & "$PWD\xp\cmake_xp.ps1" cmake -G Ninja `
            -D CMAKE_BUILD_TYPE=Release `
            -D TDESKTOP_API_ID=$id `
            -D TDESKTOP_API_HASH=$hash `
            -S . -B $env:BUILD_DIR
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build.
        run: |
          & "$PWD\xp\cmake_xp.ps1" ninja -C $env:BUILD_DIR Telegram
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # The gate that matters. A build can link, pass a smoke screenshot and still
      # be unable to start on XP - either a Vista+ DLL imported NORMAL or a Vista+
      # function entry point. Never publish an artifact that has not passed this.
      - name: XP safety.
        run: |
          & "$PWD\xp\xpsafe.ps1" -Exe "$PWD\$env:BUILD_DIR\Telegram.exe"
          if ($LASTEXITCODE -ne 0) { Write-Error 'the binary cannot start on XP'; exit 1 }

      - name: Package.
        run: |
          $name = "Telegram_XP_$env:AppVersionStr" + "_x86"
          $stage = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          # The XP build is fully static: the executable is the whole payload.
          Copy-Item "$PWD\$env:BUILD_DIR\Telegram.exe" $stage
          $zip = Join-Path $env:RUNNER_TEMP "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          echo "ARCHIVE=$zip" >> $env:GITHUB_ENV
          echo "ARCHIVE_NAME=$name.zip" >> $env:GITHUB_ENV
          Write-Output ("packaged {0:N0} bytes" -f (Get-Item $zip).Length)

      - uses: actions/upload-artifact@v7
        name: Upload the artifact.
        with:
          name: Telegram XP ${{ env.AppVersionStr }}
          path: ${{ env.ARCHIVE }}

      - name: Publish the release.
        if: inputs.publish_release || startsWith(github.ref, 'refs/tags/xp-v')
        shell: bash
        env:
          # In a fork GitHub refuses release creation even with contents: write,
          # so publishing needs a personal token - add a RELEASE_TOKEN secret with
          # 'repo' scope. Without one this step fails on a fork, which is why
          # publish_release defaults to off.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          set -e
          R="$GITHUB_REPOSITORY"
          if [[ "$GITHUB_REF" == refs/tags/xp-v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TARGET=()
          else
            TAG="xp-v$AppVersionStr"
            TARGET=(--target "$GITHUB_SHA")
          fi

          # Create only if missing, so a re-run just adds assets instead of
          # clobbering notes someone edited.
          if ! gh release view "$TAG" -R "$R" >/dev/null 2>&1; then
            gh release create "$TAG" -R "$R" "${TARGET[@]}" --draft \
              --title "Telegram Desktop $AppVersionStr for Windows XP" \
              --notes "Windows XP (SP3, x86) build of Telegram Desktop $AppVersionStr.

          A single static executable. Voice, video and group calls are absent - they
          need WebRTC, which cannot run on XP. xp/README.md lists what else the
          platform limits and how the build is produced."
          fi
          gh release upload "$TAG" -R "$R" "$ARCHIVE" --clobber
